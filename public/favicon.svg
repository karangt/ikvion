<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Globe circle -->
  <circle cx="32" cy="32" r="30" fill="#4ABFBF"/>
  <!-- Vertical centre line -->
  <ellipse cx="32" cy="32" rx="12" ry="30" fill="none" stroke="white" stroke-width="1.8"/>
  <!-- Horizontal equator -->
  <line x1="2" y1="32" x2="62" y2="32" stroke="white" stroke-width="1.8"/>
  <!-- Upper latitude line -->
  <ellipse cx="32" cy="20" rx="22" ry="5" fill="none" stroke="white" stroke-width="1.5"/>
  <!-- Lower latitude line -->
  <ellipse cx="32" cy="44" rx="22" ry="5" fill="none" stroke="white" stroke-width="1.5"/>
  <!-- Outer ring -->
  <circle cx="32" cy="32" r="30" fill="none" stroke="white" stroke-width="1.8"/>
</svg>
