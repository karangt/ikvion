<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Navy background -->
  <circle cx="16" cy="16" r="16" fill="#0F1F54"/>
  <!-- Teal globe outline -->
  <circle cx="16" cy="16" r="9.5" fill="none" stroke="#0D9488" stroke-width="1.6"/>
  <!-- Vertical centre ellipse -->
  <ellipse cx="16" cy="16" rx="5" ry="9.5" fill="none" stroke="#0D9488" stroke-width="1.2"/>
  <!-- Equator -->
  <line x1="6.5" y1="16" x2="25.5" y2="16" stroke="#0D9488" stroke-width="1.2"/>
  <!-- Upper latitude -->
  <path d="M8 11.5 Q16 9.5 24 11.5" fill="none" stroke="#0D9488" stroke-width="1"/>
  <!-- Lower latitude -->
  <path d="M8 20.5 Q16 22.5 24 20.5" fill="none" stroke="#0D9488" stroke-width="1"/>
  <!-- Arrow top-right -->
  <polyline points="22,7 25.5,6.5 25,10" fill="none" stroke="#0D9488" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
